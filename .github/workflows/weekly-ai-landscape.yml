name: Weekly AI Landscape Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  group: weekly-ai-landscape
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-landscape/requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement ai-landscape/requirements.txt
      - name: Generate and publish report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          WEEKLY_OPENAI_MODEL: ${{ vars.WEEKLY_OPENAI_MODEL }}
        run: python ai-landscape/run.py weekly
